name: Architecture Reference Check

on:
  push:
    branches:
      - docs/architecture-consolidation
  pull_request:
    paths:
      - 'docs/architecture/**'
      - 'docs/operations/**'
      - 'scripts/check-architecture-references.mjs'
      - 'src/architecture/**'
      - 'package.json'
      - '.github/workflows/architecture-check.yml'

permissions:
  contents: read

jobs:
  architecture-reference-check:
    name: Architecture references
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without submodule initialization
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c submodule.recurse=false fetch --depth=1 origin "${GITHUB_SHA}"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check canonical architecture references
        run: npm run check:architecture
