name: R11 Canonical Promotion

on:
  push:
    branches:
      - docs/architecture-consolidation
    paths:
      - .github/workflows/architecture-r11-promote.yml

permissions:
  contents: write

jobs:
  promote:
    name: Promote audited architecture corpus
    runs-on: ubuntu-24.04
    if: github.repository == 'lottarmrs/Volley'

    steps:
      - name: Checkout repository without submodule initialization
        shell: bash
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c submodule.recurse=false fetch --depth=1 origin "${GITHUB_SHA}"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Normalize R11 guard scripts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          {
            const path = 'scripts/promote-architecture-r11.mjs';
            const original = readFileSync(path, 'utf8');
            const from = `function replaceExactly(content, from, to, label) {
              const count = content.split(from).length - 1;
              if (count !== 1) {
                failures.push(\`${'${label}'}: expected exactly one occurrence, found ${'${count}'}\`);
                return content;
              }
              return content.replace(from, to);
            }`;
            const to = `function replaceExactly(content, from, to, label) {
              const count = content.split(from).length - 1;
              const expected = label === 'C7 promotion verdict' ? 2 : 1;
              if (count !== expected) {
                failures.push(\`${'${label}'}: expected exactly ${'${expected}'} occurrence(s), found ${'${count}'}\`);
                return content;
              }
              return expected === 1 ? content.replace(from, to) : content.replaceAll(from, to);
            }`;
            if (original.includes(from)) writeFileSync(path, original.replace(from, to), 'utf8');
            else if (!original.includes("const expected = label === 'C7 promotion verdict' ? 2 : 1;")) {
              throw new Error('R11 promotion guard source is neither pre-fix nor fixed');
            }
          }

          {
            const path = 'scripts/check-architecture-r11.mjs';
            let content = readFileSync(path, 'utf8');
            const replacements = [
              [
                "if (!/not an implementation default/i.test(open)) fail(openPath, 'Open Decision non-default rule disappeared during promotion');",
                "if (!/not(?:\\*\\*)? an implementation default/i.test(open)) fail(openPath, 'Open Decision non-default rule disappeared during promotion');",
              ],
              [
                "if (!/> Status:\\s*`CANONICAL \\/ C4`/.test(firstLines(hyp))) fail(hypPath, 'Hypothesis registry document is not canonical');",
                "if (!/> Status:\\s*`CANONICAL \\/ C4(?: \\/ [^`]*)?`/.test(firstLines(hyp))) fail(hypPath, 'Hypothesis registry document is not canonical');",
              ],
              [
                "if (!/NOT TARGET SOURCE OF TRUTH/i.test(head)) fail(domainModelPath, 'legacy domain model lost non-target warning');",
                "if (!/not (?:a )?target source of truth/i.test(head)) fail(domainModelPath, 'legacy domain model lost non-target warning');",
              ],
            ];
            for (const [from, to] of replacements) {
              if (content.includes(from)) content = content.replace(from, to);
              else if (!content.includes(to)) throw new Error(`R11 checker source did not match expected assertion: ${from}`);
            }
            writeFileSync(path, content, 'utf8');
          }
          NODE

      - name: R11 promotion preflight
        run: node scripts/promote-architecture-r11.mjs

      - name: Apply R11 canonical promotion
        run: node scripts/promote-architecture-r11.mjs --apply

      - name: Verify references and R10 invariants
        run: |
          node scripts/check-architecture-references.mjs
          node scripts/check-architecture-r10.mjs

      - name: Verify R11 promotion before SHA finalization
        run: node scripts/check-architecture-r11.mjs
        env:
          ALLOW_PENDING_PROMOTION_SHA: '1'

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit promoted corpus
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json docs/architecture scripts/promote-architecture-r11.mjs scripts/check-architecture-r11.mjs
          if git diff --cached --quiet; then
            echo "No R11 promotion changes to commit."
            exit 0
          fi
          git commit -m "docs(architecture): promote R11 canonical corpus"
          git push origin HEAD:docs/architecture-consolidation
