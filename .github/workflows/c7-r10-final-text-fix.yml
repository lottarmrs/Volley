name: C7 R10 Final Text Fix

on:
  push:
    branches:
      - docs/architecture-consolidation

permissions:
  contents: write

jobs:
  apply-final-text-fix:
    if: contains(github.event.head_commit.message, '[run-c7-r10-final-fix]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit without submodule initialization
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c submodule.recurse=false fetch --depth=1 origin "${GITHUB_SHA}"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD

      - name: Apply exact I/Q vocabulary fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/architecture/matrices/C5-MATRICES-MASTER.md': [
                  (
                      '- Q0/I0/I1 gaps in executable evidence;',
                      '- I0/I1 invariant-evidence gaps or under-tested Q0/Q1 QA-risk families;',
                  ),
              ],
              'docs/architecture/matrices/C5.05-PERFORMANCE-OBSERVABILITY-TEST-MATRIX.md': [
                  (
                      '8. which Q0/I0/I1 rules require real DB/RLS/concurrency/rebuild/restore evidence;',
                      '8. which I0/I1 invariants require Q0/Q1-grade DB/RLS/concurrency/rebuild/restore evidence;',
                  ),
              ],
              'docs/architecture/quality/N2.20-testing-qa.md': [
                  (
                      'Each migrated bounded context ships with its Q0/Q1 invariant matrix.',
                      'Each migrated bounded context ships with an invariant-evidence matrix that records invariant criticality (`I0..I3`) and QA risk/evidence tier (`Q0..Q3`) as separate axes.',
                  ),
                  (
                      '- every major bounded-context Q0 invariant maps to executable evidence;',
                      '- every major bounded-context I0/I1 invariant assigned to Q0-grade QA evidence maps to executable proof;',
                  ),
              ],
          }

          changed = []
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing exact pattern in {name}: {old!r}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(name)
          print('changed:', *changed, sep='\n- ')
          PY

      - name: Commit final text fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture
          git commit -m "docs(architecture): separate invariant severity from QA risk vocabulary"
          git push origin HEAD:docs/architecture-consolidation
