name: C7 R10 Remediation Writer

on:
  push:
    branches:
      - docs/architecture-consolidation

permissions:
  contents: write

jobs:
  apply-r10-remediation:
    if: contains(github.event.head_commit.message, '[run-c7-r10-remediation]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit without submodule initialization
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c submodule.recurse=false fetch --depth=1 origin "${GITHUB_SHA}"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply deterministic C7 R10 remediation
        run: node scripts/c7-r10-remediation.mjs

      - name: Commit remediation result
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No remediation changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture scripts/check-architecture-r10.mjs
          git commit -m "docs(architecture): apply C7 R10 lexical and registry remediation"
          git push origin HEAD:docs/architecture-consolidation
