server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Content-Security-Policy (achado A10 da auditoria de 2026-09-08).
    #
    # Nao havia CSP nenhum, e o X-XSS-Protection abaixo e obsoleto e ignorado por
    # navegador moderno. A auditoria nao encontrou nenhum sink de XSS no codigo: isto e
    # rede de contencao contra regressao futura e contra dependencia comprometida.
    #
    # O que cada diretiva atende, para que ninguem a afrouxe no escuro:
    #   script-src / frame-src  challenges.cloudflare.com -> widget Turnstile do login
    #   connect-src             *.supabase.co + wss       -> Data API e realtime
    #   img-src                 data: e blob:             -> html-to-image e avatares
    #   style-src               'unsafe-inline'           -> estilos inline do React/daisyUI
    #   worker-src              'self'                    -> o worker do balanceador
# O balanceador usa `new Worker(new URL(...), { type: 'module' })`, que o Vite emite
# como asset de mesma origem -- `blob:` aqui so daria a uma injecao a chance de subir
# um worker proprio. As URLs de blob que o app cria sao download e preview de imagem,
# cobertos por img-src.
    # O dominio do projeto Supabase vem de VITE_SUPABASE_URL em build, entao o curinga de
    # subdominio e o mais estreito que da para fixar aqui.
    set $volley_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://challenges.cloudflare.com; worker-src 'self'";

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";

        # Repetidos de proposito: no nginx, add_header NAO e herdado por um location
        # que define o seu proprio. Sem estas tres linhas, JS e CSS ficavam sem
        # nosniff — justamente onde MIME sniffing importa. Mesma razao para o CSP.
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy $volley_csp always;
    }

    # Security headers (valem para o location / e demais sem add_header proprio)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy $volley_csp always;
}
